<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Ver todos — Portugal</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..800;1,6..96,400..700&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0;background:#0E1714}
a{color:#E8C678}a:hover{color:#F6DFA6}
</style>
</helmet>
<div style="width: 390px; min-height: 1700px; box-sizing: border-box; background: #0E1714; color: #EDE6D6; font-family: Manrope, system-ui, sans-serif; display: flex; flex-direction: column; padding: 16px 16px 56px">

  <a href="AtlasV2.dc.html" style="align-self: flex-start; min-height: 44px; display: flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 600; text-decoration: none; color: #EDE6D6">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>Atlas
  </a>

  <nav aria-label="Países de língua portuguesa" style="display: flex; flex-direction: column; gap: 10px; padding: 18px 0 8px">
    <span style="font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; color: #A9B5AE">Escritos em português</span>
    <div style="display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none">
      <a href="#" style="flex: 0 0 auto; min-height: 44px; padding: 0 16px; border-radius: 22px; border: 1px solid #33443D; color: #EDE6D6; font-weight: 600; font-size: 14px; display: flex; align-items: center; text-decoration: none">Brasil</a>
      <a href="#" aria-current="page" style="flex: 0 0 auto; min-height: 44px; padding: 0 16px; border-radius: 22px; background: #C89B3C; color: #1A1408; font-weight: 800; font-size: 14px; display: flex; align-items: center; text-decoration: none">Portugal</a>
      <a href="#" style="flex: 0 0 auto; min-height: 44px; padding: 0 16px; border-radius: 22px; border: 1px solid #33443D; color: #EDE6D6; font-weight: 600; font-size: 14px; display: flex; align-items: center; text-decoration: none">Angola</a>
      <a href="#" style="flex: 0 0 auto; min-height: 44px; padding: 0 16px; border-radius: 22px; border: 1px solid #33443D; color: #EDE6D6; font-weight: 600; font-size: 14px; display: flex; align-items: center; text-decoration: none">Moçambique</a>
    </div>
  </nav>

  <header style="display: flex; flex-direction: column; gap: 14px; padding: 18px 0 24px; border-bottom: 1px solid #2D3E37">
    <h1 style="margin: 0; font-family: 'Bodoni Moda', Didot, serif; font-weight: 700; font-size: 74px; line-height: 0.88; letter-spacing: -0.035em; color: #C89B3C">Portugal</h1>
    <sc-if value="{{showText}}" hint-placeholder-val="{{ true }}">
      <p style="margin: 0; font-family: 'Bodoni Moda', Didot, serif; font-style: italic; font-size: 18px; line-height: 1.4; color: #F4EBD8">[Uma frase sobre o que esses livros têm em comum — gerada e revisada pela Lila, como no resumo do ano.]</p>
    </sc-if>
    <div style="display: flex; gap: 28px; align-items: baseline">
      <span style="display: flex; align-items: baseline; gap: 6px"><b style="font-family: 'Bodoni Moda', Didot, serif; font-size: 34px; color: #F4EBD8">10</b><span style="font-size: 13px; color: #BFC8C2">obras</span></span>
      <span style="display: flex; align-items: baseline; gap: 6px"><b style="font-family: 'Bodoni Moda', Didot, serif; font-size: 34px; color: #F4EBD8">5</b><span style="font-size: 13px; color: #BFC8C2">autorias</span></span>
    </div>
  </header>

  <section aria-label="Autoria em destaque" style="display: flex; align-items: center; gap: 14px; padding: 18px 0">
    <a href="Autor.dc.html" style="display: flex; align-items: center; gap: 14px; flex: 1; text-decoration: none; color: #EDE6D6; min-height: 64px">
      <span style="width: 56px; height: 56px; border-radius: 28px; background: #C89B3C; color: #1A1408; display: flex; align-items: center; justify-content: center; font-family: 'Bodoni Moda', Didot, serif; font-style: italic; font-weight: 600; font-size: 21px">JS</span>
      <span style="display: flex; flex-direction: column; gap: 2px; flex: 1">
        <span style="font-size: 16px; font-weight: 700">José Saramago</span>
        <span style="font-size: 13px; color: #A9B5AE">6 das 10 obras daqui</span>
      </span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A9B5AE" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
    </a>
  </section>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px 12px; padding-top: 8px">
    <sc-for list="{{books}}" as="b" hint-placeholder-count="10">
      <a href="ObraV2.dc.html" style="display: flex; flex-direction: column; gap: 8px; text-decoration: none; color: #EDE6D6">
        <span style="aspect-ratio: 2 / 3; box-sizing: border-box; padding: 9px 8px; background: #C89B3C; color: #1A1408; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 16px 22px -14px rgba(0,0,0,0.8)">
          <span style="font-family: 'Bodoni Moda', Didot, serif; font-style: italic; font-weight: 500; font-size: 14px; line-height: 1.04; overflow: hidden">{{b.title}}</span>
          <span style="font-size: 7.5px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase">{{b.author}}</span>
        </span>
        <span style="font-size: 13px; font-weight: 700; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden">{{b.title}}</span>
        <span style="font-size: 12px; color: #A9B5AE; margin-top: -4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{b.author}}</span>
      </a>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"showText":{"editor":"boolean","default":true},"$preview":{"width":390,"height":1700}}'>
class Component extends DCLogic {
  renderVals() {
    const books = [
      ['Ensaio sobre a Cegueira', 'José Saramago'], ['O Evangelho segundo Jesus Cristo', 'José Saramago'], ['Memorial do Convento', 'José Saramago'],
      ['Ensaio sobre a Lucidez', 'José Saramago'], ['As Intermitências da Morte', 'José Saramago'], ['Caim', 'José Saramago'],
      ['A Máquina de Fazer Espanhóis', 'Valter Hugo Mãe'], ['Os Maias', 'Eça de Queirós'], ['Livro do Desassossego', 'Fernando Pessoa'], ['O Retorno', 'Dulce Maria Cardoso']
    ].map(([title, author]) => ({ title, author }));
    return { showText: this.props.showText ?? true, books };
  }
}
</script>
</body>
</html>
