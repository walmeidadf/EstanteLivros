name: Deploy

# Publica a Estante da Lila no Cloudflare Pages.
# Push em main → produção. Pull request → preview (URL efêmera).
# O build roda o mesmo portão de qualidade do local (check + test + build);
# catálogo inválido quebra o build e NADA é publicado.

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "catalog/**"
      - ".github/workflows/deploy.yml"
  pull_request:
    paths:
      - "app/**"
      - "catalog/**"
      - ".github/workflows/deploy.yml"

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Instalar dependências (versões travadas)
        run: npm ci
        working-directory: app

      - name: Checar tipos
        run: npm run check
        working-directory: app

      - name: Testes
        run: npm test
        working-directory: app

      - name: Build (quebra se o catálogo for inválido)
        run: npm run build
        working-directory: app

      - name: Publicar no Cloudflare Pages
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: app
          command: pages deploy dist --project-name=prateleira-liliane
